# GitHub Pages 自动部署:push 到 main 即构建并发布到 https://tom-575.github.io/DO/
# 前置条件(一次性,需在仓库网页操作):Settings → Pages → Source 选 "GitHub Actions"
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个 Pages 部署在跑;排队而非取消,保证每次变更最终都会发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          # 仓库根目录没有 package-lock.json,锁文件在原型子目录里
          cache-dependency-path: prototypes/first-loop/package-lock.json

      - name: Install dependencies
        working-directory: prototypes/first-loop
        run: npm ci

      - name: Build
        working-directory: prototypes/first-loop
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/first-loop/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
